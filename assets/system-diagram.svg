  <title
     id="diagram-title">IMU body axes with camera projection</title>
  <desc
     id="diagram-description">A world frame locates the IMU body axes. The IMU reads specific force and angular velocity, while the camera projects a world landmark onto an image plane.</desc>
  <style
     id="style1">
    @font-face { font-family: &quot;Latin Modern Roman&quot;; src: url(&quot;assets/fonts/lmroman10-regular.otf&quot;) format(&quot;opentype&quot;), url(&quot;fonts/lmroman10-regular.otf&quot;) format(&quot;opentype&quot;); font-style: normal; }
    @font-face { font-family: &quot;Latin Modern Roman&quot;; src: url(&quot;assets/fonts/lmroman10-italic.otf&quot;) format(&quot;opentype&quot;), url(&quot;fonts/lmroman10-italic.otf&quot;) format(&quot;opentype&quot;); font-style: italic; }
    text { user-select: none; }
    .math { font-family: &quot;Latin Modern Roman&quot;, Georgia, serif; font-size: 27px; font-style: italic; fill: #182126; }
    .sub { baseline-shift: sub; font-size: 67%; }
    .super { baseline-shift: super; font-size: 67%; }
    .world-layer circle, .landmark, .imu-body-origin { fill: #182126; }
    .axis, .pose-leader, .body-gravity, .signal-path, .camera-axis, .pixel-axis, .imu-world-up, .imu-body-vector, .imu-body-spin { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .axis { stroke: #182126; stroke-width: 2.5; }
    .frame-label { font-size: 30px; }
    .frame-axis-label { font-size: 22px; }
    .frame-symbol { fill: #182126; font-size: 25px; paint-order: stroke; stroke: #fff; stroke-width: 6px; stroke-linejoin: round; }
    .frame-origin { fill: #fff; stroke: #182126; stroke-width: 2.5; }
    .pose-leader { stroke: #788085; stroke-width: 1.7; stroke-dasharray: 1 10; }
    .pose-label { fill: #788085; font-size: 21px; }
    .transform-label { paint-order: stroke; stroke: #fff; stroke-width: 9px; stroke-linejoin: round; }
    .imu-world-up { stroke: #b8c4ca; stroke-width: 1.3; stroke-dasharray: 4 7; }
    .imu-body-vector { stroke-width: 3; }
    .imu-body-x { stroke: #c45c55; }
    .imu-body-y { stroke: #438d69; }
    .imu-body-z { stroke: #3e7c9b; }
    .imu-body-force { stroke: #7565ae; stroke-width: 4; }
    .imu-body-spin { stroke: #182126; stroke-width: 1.8; }
    .imu-body-label { font-size: 21px; paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; }
    .imu-x-label { fill: #c45c55; }
    .imu-y-label { fill: #438d69; }
    .imu-z-label { fill: #3e7c9b; }
    .imu-force-label { fill: #7565ae; }
    .imu-world-label { fill: #788085; }
    .imu-spin-label { fill: #182126; }
    .imu-origin-label { font-size: 22px; }
    .body-gravity { stroke: #788085; stroke-width: 2; }
    .gravity-label { fill: #788085; font-size: 25px; }
    .sensor-title { fill: #426b78; font-family: Inter, ui-sans-serif, sans-serif; font-weight: 700; letter-spacing: -.02em; font-size: 20px; }
    .sensor-equation { font-size: 28px; }
    .sensor-equation .sub { baseline-shift: -18%; font-size: 62%; }
    .signal-path, .signal-trace { stroke: #426b78; stroke-width: 1.9; }
    .sensor-node { fill: #fff; stroke: #426b78; stroke-width: 2.5; }
    .signal-trace { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .sensor-note { fill: #788085; font-family: &quot;Latin Modern Roman&quot;, Georgia, serif; font-size: 18px; }
    .camera-body path, .camera-body circle { fill: #fff; stroke: #182126; stroke-width: 2.5; }
    .extrinsic-label { fill: #788085; font-size: 20px; }
    .camera-transform { stroke-width: 1.7; }
    .camera-axis { stroke: #426b78; stroke-width: 2.5; }
    .camera-axis.secondary { stroke-width: 2; }
    .axis-label { fill: #426b78; font-size: 21px; opacity: .82; }
    .frustum { fill: none; stroke: #ccd1d3; stroke-width: 2; }
    .frustum-field { fill: #f7fafb; }
    .image-plane { fill: #f2f7f8; stroke: #91a8ae; stroke-width: 2.1; }
    .plane-title { fill: #426b78; font: 600 16px/1 Inter, ui-sans-serif, sans-serif; text-anchor: end; }
    .plane-rule { fill: none; stroke: #e2e5e6; stroke-width: 1; }
    .measurement-ray { fill: none; stroke: #426b78; stroke-width: 3.2; }
    .landmark-ray { fill: none; stroke: #182126; stroke-width: 2.5; stroke-dasharray: 10 10; }
    .projection-leader { fill: none; stroke: #91a8ae; stroke-width: 1.4; }
    .projection { fill: #fff; stroke: #426b78; stroke-width: 4; }
    .pixel-axis { stroke: #182126; stroke-width: 2; }
    .pixel-label { font-size: 23px; }
    .measurement-label, .landmark-label { font-size: 24px; paint-order: stroke; stroke: #fff; stroke-width: 7px; stroke-linejoin: round; }
    .optical-label { font-size: 17px; }
    .world-layer, .vehicle-layer, .imu-layer, .camera-layer { transition: opacity 180ms ease; }
    .sensor-target { cursor: pointer; }
    .sensor-target:focus-visible { outline: 2px solid #426b78; outline-offset: 4px; }
    svg[data-focus=&quot;imu&quot;] .camera-layer, svg[data-focus=&quot;imu&quot;] .world-layer, svg[data-focus=&quot;camera&quot;] .imu-layer { opacity: .14; }
    @media (prefers-reduced-motion: reduce) { .world-layer, .vehicle-layer, .imu-layer, .camera-layer { transition: none; } }
